name: Import des donnees originales et calculs des cinq prototypes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-project.yml'
      - 'scripts/import_originals.py'
permissions:
  contents: write
concurrency:
  group: import-concours-2026
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Recuperer les sept originaux et verifier leurs SHA-256
        run: python3 scripts/import_originals.py
      - name: Preparer les calculs reproductibles
        run: |
          python3 -m venv /tmp/concours-python
          /tmp/concours-python/bin/python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0
          /tmp/concours-python/bin/python scripts/prepare.py
          /tmp/concours-python/bin/python scripts/pages.py
      - name: Verifier les donnees et le code
        run: |
          node --test tests/core.test.js
          /tmp/concours-python/bin/python tests/data_checks.py
      - name: Enregistrer les donnees et supprimer le workflow temporaire
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/import-project.yml
          git add DONNEES data ANALYSE.json index.html idees assets/favicon.svg
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Import verified original datasets and generated data for all five prototypes"
            git push origin HEAD:main
          fi
